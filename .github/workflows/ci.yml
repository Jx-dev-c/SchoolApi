name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Testcontainers sobe o PostgreSQL sozinho — o runner do GitHub já tem
      # Docker, então não é preciso declarar service container aqui.
      - name: Testes de integração
        run: dotnet test --no-build --configuration Release --verbosity normal

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4

      # só monta a imagem para garantir que o Dockerfile continua válido;
      # publicar em registry fica para quando houver ambiente de produção
      - name: Build da imagem
        run: docker build -t schoolapi:${{ github.sha }} .
